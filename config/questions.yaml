# 鎌倉コミュニティ通貨アンケート 設問定義
# このファイルを編集するだけで入力画面と集計が追従します
# 変更時はアプリを再起動（またはページをリロード）してください

# 調査地点の選択肢
locations:
  - "鎌倉駅東口"
  - "小町通り入口"
  - "鶴岡八幡宮周辺"

# 冒頭文（調査員が読み上げる）
preamble: >
  千葉工業大学の学生です。卒業研究で、鎌倉の観光と地域の取り組みについて調査しています。
  1〜2分で終わります。お名前など個人情報は伺いません。

# 設問定義
# type: single_choice / multi_choice / free_text / scale
# required: 必須かどうか
# branch: この設問が属する分岐（省略 = 全員に表示）
# show_if: 表示条件（他の設問の回答に依存）
# has_other: 「その他（記述）」を追加
# max_select: 複数選択の上限数
# determines_branch: 分岐を決定する設問
# options[].branch: この選択肢を選んだ場合の分岐先
# options[].branch_if: 条件付き分岐（他の設問の値で分岐先が変わる場合）

questions:
  # === 基本属性 ===
  Q1:
    text: "居住地"
    type: single_choice
    required: true
    options:
      - label: "鎌倉市内"
        value: "kamakura"
        tag: "resident"
      - label: "神奈川県内（鎌倉市外）"
        value: "kanagawa"
      - label: "県外"
        value: "other_pref"
      - label: "海外"
        value: "overseas"

  Q2:
    text: "鎌倉への来訪回数"
    type: single_choice
    required: true
    options:
      - label: "初めて"
        value: "first"
      - label: "2〜5回"
        value: "2to5"
      - label: "6回以上"
        value: "6plus"
      - label: "ほぼ毎日（通勤通学）"
        value: "daily"

  Q3:
    text: "今日の滞在予定"
    type: single_choice
    required: true
    options:
      - label: "2時間未満"
        value: "under_2h"
      - label: "半日程度"
        value: "half_day"
      - label: "1日"
        value: "full_day"
      - label: "宿泊"
        value: "overnight"

  # === クルッポの認知 ===
  Q4:
    text: "鎌倉で使える地域通貨やポイントサービスをご存じですか"
    description: "（純粋想起：名前を出さずに尋ねる。グループの場合「せーの」で同時に）"
    type: single_choice
    required: true
    options:
      - label: "名前を言える"
        value: "can_name"
      - label: "聞いたことはある"
        value: "heard"
      - label: "知らない"
        value: "unknown"

  Q4_name:
    text: "知っているサービスの名前"
    type: free_text
    required: true
    show_if:
      question_id: "Q4"
      value: "can_name"

  Q5:
    text: "このサービスを見たことがありますか？"
    description: "（助成想起：ロゴ・アプリ画面を提示して尋ねる）"
    type: single_choice
    required: true
    options:
      - label: "ある"
        value: "yes"
      - label: "ない"
        value: "no"

  Q5_2:
    text: "どこで見ましたか？"
    type: multi_choice
    required: true
    show_if:
      question_id: "Q5"
      value: "yes"
    options:
      - label: "駅のポスター"
        value: "station_poster"
      - label: "お店の掲示"
        value: "shop_display"
      - label: "SNS"
        value: "sns"
      - label: "知人から"
        value: "acquaintance"
      - label: "自治体の広報"
        value: "municipal"
      - label: "思い出せない"
        value: "forgot"

  Q6:
    text: "まちのコイン（クルッポ）を使ったことがありますか？"
    type: single_choice
    required: true
    determines_branch: true
    options:
      - label: "今も使っている"
        value: "active"
        branch: "A"
      - label: "以前使ったが今は使っていない"
        value: "lapsed"
        branch: "A"
      - label: "アプリは入れたが使っていない"
        value: "installed_unused"
        branch: "B"
      - label: "使ったことはない"
        value: "never"
        branch_if:
          question_id: "Q5"
          value: "yes"
          branch: "B"

  # === 分岐A：利用経験あり ===
  A1:
    text: "どんな場面で使いましたか？"
    type: multi_choice
    required: true
    branch: "A"
    has_other: true
    options:
      - label: "駅でのチェックイン"
        value: "checkin"
      - label: "お店での体験"
        value: "shop_experience"
      - label: "ごみ拾いなどのイベント"
        value: "event"
      - label: "給水スポット"
        value: "water_spot"
      - label: "友人に送った"
        value: "sent_friend"

  A2:
    text: "良かった点"
    type: multi_choice
    required: true
    branch: "A"
    has_other: true
    options:
      - label: "楽しい・ゲーム感覚"
        value: "fun"
      - label: "お得感"
        value: "good_deal"
      - label: "地域や人とのつながり"
        value: "community"
      - label: "新しい店を知れた"
        value: "new_shops"
      - label: "SDGsに貢献できた"
        value: "sdgs"
      - label: "特になし"
        value: "none"

  A3:
    text: "不満だった点"
    type: multi_choice
    required: true
    branch: "A"
    has_other: true
    options:
      - label: "使える店・体験が少ない"
        value: "few_shops"
      - label: "使い道がない"
        value: "no_use"
      - label: "操作が面倒"
        value: "troublesome"
      - label: "有効期限で失効した"
        value: "expired"
      - label: "鎌倉に来る機会が少ない"
        value: "no_visit"
      - label: "特になし"
        value: "none"

  A4:
    text: "使わなくなった一番の理由"
    type: single_choice
    required: true
    branch: "A"
    has_other: true
    show_if:
      question_id: "Q6"
      value: "lapsed"
    options:
      - label: "使える店・体験が少ない"
        value: "few_shops"
      - label: "使い道がない"
        value: "no_use"
      - label: "操作が面倒"
        value: "troublesome"
      - label: "有効期限で失効した"
        value: "expired"
      - label: "鎌倉に来る機会が少ない"
        value: "no_visit"
      - label: "特になし"
        value: "none"

  A5:
    text: "クルッポが2027年3月で終了することを知っていましたか？"
    type: single_choice
    required: true
    branch: "A"
    options:
      - label: "知っていた"
        value: "knew"
      - label: "知らなかった"
        value: "didnt_know"

  A6:
    text: "使ってみての感想を一言"
    type: free_text
    required: false
    branch: "A"
    codebook: "A6"

  # === 分岐B：知っていたが使わなかった ===
  B1:
    text: "使わなかった理由"
    type: multi_choice
    required: true
    branch: "B"
    has_other: true
    options:
      - label: "アプリを入れるのが面倒"
        value: "app_trouble"
      - label: "何に使えるのかわからない"
        value: "unclear_use"
      - label: "現金に換えられないなら意味がない"
        value: "no_cash"
      - label: "滞在時間が短く余裕がない"
        value: "no_time"
      - label: "観光中にスマホを操作したくない"
        value: "no_phone"
      - label: "得になる気がしない"
        value: "no_benefit"

  B2:
    text: "理由の補足"
    type: free_text
    required: false
    branch: "B"
    codebook: "B2"

  # === 共通（全員） ===
  C1:
    text: "観光中に、次の行動で特典がもらえるとしたら、やってみたいもの"
    description: "鎌倉では、観光客に混雑を避けたり、ごみを減らしたりしてもらう取り組みが検討されています。"
    type: multi_choice
    required: true
    options:
      - label: "混雑していない時間帯・場所を選んで回る"
        value: "avoid_crowd"
      - label: "ごみを持ち帰る・ごみ拾いに参加する"
        value: "trash"
      - label: "地元の個人店に立ち寄る"
        value: "local_shop"
      - label: "車でなく公共交通で来る"
        value: "public_transport"
      - label: "マイボトルで給水する"
        value: "my_bottle"
      - label: "寺社の参拝マナーを学ぶ（クイズなど）"
        value: "manner_quiz"
      - label: "どれもやらない"
        value: "none"

  C2:
    text: "魅力的な特典（最大2つまで）"
    type: multi_choice
    required: true
    max_select: 2
    options:
      - label: "割引・金券（お金と同じように使える）"
        value: "discount"
      - label: "限定体験（裏メニュー・特別拝観など）"
        value: "exclusive"
      - label: "記念品・グッズ"
        value: "souvenir"
      - label: "抽選で豪華景品"
        value: "lottery"
      - label: "地域への寄付・貢献に使われる"
        value: "donation"
      - label: "特典はいらない"
        value: "no_reward"

  C3:
    text: "参加するとしたら、どこまでの手間なら許容できますか？"
    type: single_choice
    required: true
    options:
      - label: "専用アプリを入れてもよい"
        value: "app_ok"
      - label: "LINEの友だち登録までなら"
        value: "line_ok"
      - label: "QRを読むだけ（アプリ不要）なら"
        value: "qr_only"
      - label: "紙のスタンプカードなら"
        value: "paper_stamp"
      - label: "手間がかかるなら参加しない"
        value: "no_effort"

  # === 属性 ===
  Q7:
    text: "年代"
    type: single_choice
    required: true
    options:
      - label: "10代"
        value: "10s"
      - label: "20代"
        value: "20s"
      - label: "30代"
        value: "30s"
      - label: "40代"
        value: "40s"
      - label: "50代"
        value: "50s"
      - label: "60代以上"
        value: "60plus"

  Q8:
    text: "性別"
    type: single_choice
    required: true
    options:
      - label: "男性"
        value: "male"
      - label: "女性"
        value: "female"
      - label: "回答しない"
        value: "no_answer"

# 集計設定
aggregation:
  cross_tabs:
    - question_id: "Q1"
      label: "居住地別"
    - question_id: "Q2"
      label: "来訪回数別"
    - question_id: "Q3"
      label: "滞在予定別"
    - question_id: "Q7"
      label: "年代別"

  awareness_comparison:
    unaided: "Q4"
    aided: "Q5"
